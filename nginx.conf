server {
    listen 80;
    server_name your-domain.com;  # 替换为您的域名
    
    # 网站根目录
    root /www/wwwroot/your-domain.com;  # 替换为您的实际路径
    index index.html;
    
    # 主页面
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 网页版体验入口
    location /web/ {
        alias /www/wwwroot/your-domain.com/web/;
        try_files $uri $uri/ /web/index.html;
    }
    
    # 静态资源
    location /static/ {
        alias /www/wwwroot/your-domain.com/web/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # APK下载
    location ~* \.(apk)$ {
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        expires 1d;
    }
    
    # 安全设置
    location ~ /\. {
        deny all;
    }
    
    # 日志
    access_log /www/wwwlogs/your-domain.com.log;
    error_log /www/wwwlogs/your-domain.com.error.log;
}

